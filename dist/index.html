<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>금융거래확인서 자동화</title>
    <script type="module" crossorigin src="/assets/index-C93FW5iv.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B2kYwA-X.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">AX PoC</p>
        <h1>금융거래확인서 자동화</h1>
        <p>문서의 문자와 숫자를 자동 인식하여 거래 내역 확인 결과를 만듭니다.</p>
      </header>

      <section class="panel" aria-labelledby="upload-title">
        <h2 id="upload-title">1. 금융거래확인서 업로드</h2>
        <label class="upload-area" for="file-input">
          <span class="upload-icon">↑</span>
          <strong>파일을 선택하세요</strong>
          <span>JPG, PNG, PDF 파일만 지원합니다.</span>
          <input id="file-input" type="file" accept="image/jpeg,image/png,application/pdf" />
        </label>
        <p id="file-name" class="muted" aria-live="polite">선택된 파일이 없습니다.</p>
        <button id="process-button" class="primary" type="button" disabled>문서 인식 및 확인 시작</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section id="result-section" class="panel hidden" aria-labelledby="result-title">
        <div class="section-heading">
          <div>
            <h2 id="result-title">2. 확인 결과</h2>
            <p class="muted">사전에 설정된 확인 기준에 따라 인식된 거래 내역을 확인한 결과입니다.</p>
          </div>
          <button id="download-button" class="secondary" type="button">공문 이미지 다운로드</button>
        </div>
        <div id="certificate" class="certificate">
          <div class="certificate-header">
            <p>금융거래확인 결과</p>
            <span id="result-date"></span>
          </div>
          <div class="final-result">
            <span>최종 결과</span>
            <strong id="final-result"></strong>
          </div>
          <table>
            <thead><tr><th>거래 내역</th><th>확인 결과</th></tr></thead>
            <tbody id="result-list"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
