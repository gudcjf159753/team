<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>금융거래확인서 자동화</title>
<style>
:root{font-family:"Malgun Gothic","맑은 고딕",sans-serif;color:#172b3a;background:#eef4f7}*{box-sizing:border-box}body{margin:0}.app{width:min(1100px,calc(100% - 32px));margin:auto;padding:30px 0 64px}.hero{padding:30px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#143d61,#137b7c)}.eyebrow{margin:0 0 7px;color:#b7eff0;font-size:.78rem;font-weight:700;letter-spacing:.1em}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem)}.hero p:last-child{margin:9px 0 0;color:#e1f6f7}.panel{margin-top:18px;padding:25px;border:1px solid #d4e2e8;border-radius:15px;background:#fff;box-shadow:0 5px 18px #14324a0c}h2{margin:0 0 7px;color:#174764;font-size:1.2rem}.sub,.hint{margin:0;color:#607588;font-size:.92rem}.upload{display:flex;min-height:168px;margin-top:18px;padding:20px;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:2px dashed #72aab9;border-radius:12px;background:#f6fbfc;color:#496372;cursor:pointer;text-align:center}.upload:hover{background:#edf8f8}.icon{display:grid;width:42px;height:42px;place-items:center;border-radius:50%;background:#197888;color:#fff;font-size:1.4rem}#image{position:absolute;width:1px;height:1px;opacity:0}.file{margin:10px 0;color:#607588}.primary,.download,.pager-button{padding:11px 16px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.primary{color:#fff;background:#197888}.primary:disabled,.pager-button:disabled{opacity:.55;cursor:not-allowed}.download{color:#124a61;background:#e0f2f3}.pager-button{color:#124a61;background:#e0f2f3}.status{min-height:24px;margin:12px 0 0}.error{color:#b42318}.working{color:#12647b}.success{color:#147343}.hidden{display:none}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}.page-label{min-width:170px;text-align:center;color:#174764}.report{margin-top:18px;padding:24px;border:1px solid #bed5df;background:#fff}.report-head{display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid #197888}.report-head strong{color:#174764}.section{margin-top:22px}.section h3{margin:0 0 10px;padding-left:8px;border-left:4px solid #197888;color:#174764;font-size:1rem}.detail-group+.detail-group{margin-top:20px}.detail-group h4{margin:0 0 8px;color:#174764;font-size:.95rem}.info{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid #d5e0e6;border-left:1px solid #d5e0e6}.info div{display:grid;grid-template-columns:120px 1fr;border-right:1px solid #d5e0e6;border-bottom:1px solid #d5e0e6}.info b{padding:10px;background:#eef7f8;color:#174764;font-size:.9rem}.info span{padding:10px;word-break:break-word}.pass{color:#147343;font-weight:800}.fail{color:#b42318;font-weight:800}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:10px;border:1px solid #d5e0e6;text-align:left;word-break:break-word}th{background:#eef7f8;color:#174764}td.num,th.num{text-align:right}.scroll{overflow-x:auto}.empty{padding:13px;background:#fff7ed;color:#9a4c00}.foot{margin:16px 0 0;text-align:right}.small{font-size:.82rem;color:#607588}@media(max-width:680px){.app{width:min(100% - 20px,1100px);padding-top:16px}.hero,.panel{padding:20px}.top,.report-head{flex-direction:column}.download{width:100%}.pagination{gap:8px}.pager-button{padding:10px}.page-label{min-width:auto}.report{padding:16px}.info{grid-template-columns:1fr}.info div{grid-template-columns:105px 1fr}table{font-size:.82rem}th,td{padding:8px}}
</style></head><body><main class="app">
<header class="hero"><p class="eyebrow">OPENAI GPT-6 LUNA</p><h1>금융거래확인서 자동화</h1><p>이미지에서 번호를 분석하고 내장된 샘플 원시 데이터와 매칭합니다.</p></header>
<section class="panel"><h2>1. 이미지파일 업로드</h2><p class="sub">여러 이미지 파일을 선택할 수 있습니다. 읽을 수 있는 이미지 파일은 자동으로 분석용 PNG로 변환됩니다.</p><label class="upload" for="image"><span class="icon">↑</span><strong>사업자등록증 이미지 선택</strong><span>여러 이미지 파일을 선택할 수 있습니다.</span><input id="image" type="file" accept="image/*" multiple></label><p id="file" class="file">선택된 파일이 없습니다.</p><button id="analyze" class="primary" disabled>OpenAI로 분석 시작</button><p id="status" class="status" role="status"></p><p class="hint">업로드한 이미지는 분석을 위해 OpenAI API에 전달됩니다.</p></section>
<section id="result" class="panel hidden"><div class="top"><div><h2>2. 분석결과</h2><p class="sub">사업자등록번호별 결과를 이 영역에서 페이지로 나누어 표시합니다.</p></div><button id="download" class="download">PDF 다운로드</button></div><div id="pagination" class="pagination"><button id="previous" class="pager-button" type="button">이전</button><strong id="page-label" class="page-label"></strong><button id="next" class="pager-button" type="button">다음</button></div><div id="reports"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script>
const $=s=>document.querySelector(s),input=$("#image"),button=$("#analyze"),status=$("#status"),reports=$("#reports"),previous=$("#previous"),next=$("#next"),pageLabel=$("#page-label");
let reportEntries=[],currentPage=0;
const won=n=>new Intl.NumberFormat("ko-KR").format(n||0);
const setStatus=(text,kind="")=>{status.textContent=text;status.className="status "+kind};
input.addEventListener("change",()=>{const files=Array.from(input.files);$("#file").textContent=files.length?files.map(file=>file.name).join(", "):"선택된 파일이 없습니다.";button.disabled=!files.length;reportEntries=[];currentPage=0;$("#result").classList.add("hidden");setStatus("")});
function row(cells){const tr=document.createElement("tr");cells.forEach((cell,index)=>{const td=document.createElement("td");td.textContent=cell;if(index>1)td.className="num";tr.append(td)});return tr}
function section(title){const element=document.createElement("section"),heading=document.createElement("h3");element.className="section";heading.textContent=title;element.append(heading);return element}
function detailGroup(category,items){const group=document.createElement("section"),title=document.createElement("h4"),wrap=document.createElement("div"),table=document.createElement("table"),body=document.createElement("tbody");group.className="detail-group";title.textContent=category+" 상세내역";wrap.className="scroll";table.innerHTML="<thead><tr><th>No.</th><th>상품명</th><th>계좌/카드번호</th><th class=\"num\">한도금액</th><th class=\"num\">사용금액</th><th class=\"num\">잔액</th><th class=\"num\">대출금액</th><th class=\"num\">연체금액</th><th>거래일자</th></tr></thead>";items.forEach(item=>body.append(row([item.number,item.product,item.account,won(item.limit),won(item.used),won(item.balance),won(item.loan),won(item.delinquent),item.date])));table.append(body);wrap.append(table);group.append(title,wrap);return group}
function createReportPage(entry){const report=entry.report,company=report.company||{},page=document.createElement("article"),head=document.createElement("div"),title=document.createElement("strong"),date=document.createElement("span");page.className="report";head.className="report-head";title.textContent="금융거래확인서 자동화 | 업체별 분석";date.className="small";date.textContent=new Intl.DateTimeFormat("ko-KR").format(new Date());head.append(title,date);page.append(head);const infoSection=section("01 업체별 기본정보"),info=document.createElement("div");info.className="info";[["기업명",company.name||"미확인"],["사업자등록번호",company.business_number||entry.business_number||"미확인"],["대표자명",company.representative||"미확인"],["법인등록번호",company.corporate_number||"미확인"],["본점주소",company.address||"미확인"],["거래기간",report.period]].forEach(([label,value])=>{const item=document.createElement("div"),key=document.createElement("b"),text=document.createElement("span");key.textContent=label;text.textContent=value;item.append(key,text);info.append(item)});infoSection.append(info);page.append(infoSection);const productSection=section("02 금융거래 상품 현황"),productWrap=document.createElement("div"),productTable=document.createElement("table"),productBody=document.createElement("tbody");productWrap.className="scroll";productTable.innerHTML="<thead><tr><th>구분</th><th>건수</th><th class=\"num\">한도금액(원)</th><th class=\"num\">사용금액(원)</th><th class=\"num\">잔액(원)</th><th class=\"num\">대출금액(원)</th><th>연체건수</th></tr></thead>";if(!report.products.length){productBody.innerHTML='<tr><td colspan="7" class="empty">일치하는 거래 데이터가 없습니다.</td></tr>'}else{report.products.forEach(item=>productBody.append(row([item.category,won(item.count),won(item.limit),won(item.used),won(item.balance),won(item.loan),won(item.delinquent_count)])))}productTable.append(productBody);productWrap.append(productTable);productSection.append(productWrap);page.append(productSection);const detailSection=section("03 거래별 상세내역");if(!report.details.length){detailSection.innerHTML+='<p class="empty">일치하는 거래 데이터가 없습니다.</p>'}else{const groups=report.details.reduce((all,item)=>{(all[item.category]??=[]).push(item);return all},{});Object.entries(groups).forEach(([category,items])=>detailSection.append(detailGroup(category,items)))}page.append(detailSection);const foot=document.createElement("p");foot.className="foot small";foot.textContent="샘플 raw 데이터.csv 기준";page.append(foot);return page}
function renderPage(){reports.replaceChildren();if(!reportEntries.length)return;reports.append(createReportPage(reportEntries[currentPage]));pageLabel.textContent=`${currentPage+1}페이지 / ${reportEntries.length}페이지`;previous.disabled=currentPage===0;next.disabled=currentPage===reportEntries.length-1}
function display(data){reportEntries=data.reports;currentPage=0;renderPage();$("#result").classList.remove("hidden")}
previous.addEventListener("click",()=>{if(currentPage>0){currentPage--;renderPage()}});next.addEventListener("click",()=>{if(currentPage<reportEntries.length-1){currentPage++;renderPage()}});
button.addEventListener("click",async()=>{const files=Array.from(input.files);if(!files.length)return;if(location.protocol==="file:"){setStatus("run.bat을 실행한 뒤 자동으로 열린 화면에서 다시 시도하세요.","error");return}button.disabled=true;setStatus(`${files.length}개 이미지를 분석하고 원시 데이터와 매칭하는 중입니다.`,"working");try{const form=new FormData();files.forEach(file=>form.append("image",file));const response=await fetch("/api/analyze",{method:"POST",body:form}),data=await response.json();if(!response.ok)throw new Error(data.error||"분석에 실패했습니다.");display(data);setStatus(`${data.analyzed_file_count}개 이미지 분석이 완료되었습니다.`,"success")}catch(error){setStatus(error instanceof TypeError?"분석 서버에 연결할 수 없습니다. run.bat을 실행하세요.":error.message,"error")}finally{button.disabled=false}});
$("#download").addEventListener("click",async()=>{try{if(!reportEntries.length)return;const savedPage=currentPage;setStatus("PDF 파일을 생성하는 중입니다.","working");const {jsPDF}=window.jspdf,pdf=new jsPDF("p","mm","a4"),pw=210,ph=297;for(let index=0;index<reportEntries.length;index++){currentPage=index;renderPage();if(index)pdf.addPage();const canvas=await html2canvas($(".report"),{backgroundColor:"#fff",scale:2}),img=canvas.toDataURL("image/png"),height=canvas.height*pw/canvas.width;let remaining=height,position=0;pdf.addImage(img,"PNG",0,position,pw,height);remaining-=ph;while(remaining>0){position=remaining-height;pdf.addPage();pdf.addImage(img,"PNG",0,position,pw,height);remaining-=ph}}currentPage=savedPage;renderPage();pdf.save("금융거래확인서-자동화-분석결과.pdf");setStatus("PDF 파일을 다운로드했습니다.","success")}catch{setStatus("PDF 생성 또는 다운로드에 실패했습니다.","error")}});
</script></body></html>
